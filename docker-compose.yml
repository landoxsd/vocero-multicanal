# ============================================================
# Vocero CRM — Ruta B: app + Postgres + Caddy (HTTPS automático)
# Uso:  cp .env.example .env  →  rellenar  →  docker compose up -d --build
# ============================================================
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vocero
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
      WA_WEB_MANAGER_URL: http://whatsapp-web-manager:3005
      WA_WEB_INTERNAL_WEBHOOK_URL: http://app:3000/api/webhooks/whatsapp-web
      WA_WEB_WEBHOOK_SECRET: ${WA_WEB_WEBHOOK_SECRET}
      WA_WEB_MANAGER_API_KEY: ${WA_WEB_MANAGER_API_KEY:-}
      MEDIA_DIR: /data/media
    volumes:
      - vocero_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    # el HEALTHCHECK vive en el Dockerfile (/api/health)

  whatsapp-web-manager:
    build: ./services/whatsapp-web-manager
    restart: unless-stopped
    shm_size: "512mb"
    environment:
      PORT: 3005
      HEADLESS: "true"
      SESSIONS_DIR: /app/sessions
      DEFAULT_WEBHOOK_URL: http://app:3000/api/webhooks/whatsapp-web
      WA_WEB_WEBHOOK_SECRET: ${WA_WEB_WEBHOOK_SECRET}
      API_KEY: ${WA_WEB_MANAGER_API_KEY:-}
      WA_RECONNECT_MAX_ATTEMPTS: ${WA_RECONNECT_MAX_ATTEMPTS:-12}
      MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:-}
    volumes:
      - vocero_wa_sessions:/app/sessions
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3005/health"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vocero
    volumes:
      - vocero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocero"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vocero_caddy_data:/data
      - vocero_caddy_config:/config
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  vocero_pg:
  vocero_caddy_data:
  vocero_caddy_config:
  vocero_wa_sessions:
  vocero_media:
